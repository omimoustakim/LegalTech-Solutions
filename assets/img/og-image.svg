<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Fond papier teinté -->
  <rect width="1200" height="630" fill="#F5F3F8"/>
  
  <!-- Bandeau violet haut (style "acte juridique") -->
  <rect x="0" y="0" width="1200" height="120" fill="#4B2380"/>
  
  <!-- Ligne de séparation dorée (surligneur) -->
  <rect x="0" y="120" width="1200" height="6" fill="#F4DD5A"/>
  
  <!-- Logo § centré en haut -->
  <circle cx="600" cy="180" r="70" fill="#4B2380"/>
  <circle cx="600" cy="180" r="56" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" fill="#fff">§</text>
  
  <!-- Nom de l'agence -->
  <text x="600" y="310" text-anchor="middle" font-family="IBM Plex Serif, Georgia, 'Times New Roman', serif" font-size="48" font-weight="600" fill="#1B1530" letter-spacing="-0.02em">LegalTech</text>
  <text x="600" y="370" text-anchor="middle" font-family="IBM Plex Serif, Georgia, 'Times New Roman', serif" font-size="48" font-weight="600" fill="#1B1530" letter-spacing="-0.02em">Solutions</text>
  
  <!-- Baseline -->
  <text x="600" y="440" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="22" font-weight="400" fill="#4B4462">L'alliance du code et du droit pour l'écosystème numérique africain</text>
  
  <!-- Tags d'expertise -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#6A3FA6">
    <text x="600" y="510" text-anchor="middle" letter-spacing="0.06em">Sites web · E-commerce Mobile Money · Conformité RGPD africain</text>
    <text x="600" y="540" text-anchor="middle" letter-spacing="0.06em">Mentions légales · CGV · Secrétariat juridique · Pack Sérénité</text>
  </g>
  
  <!-- Bandeau bas violet -->
  <rect x="0" y="570" width="1200" height="60" fill="#4B2380"/>
  <text x="600" y="610" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16" font-weight="500" fill="#fff" opacity="0.9">Togo · Bénin · France · Diaspora  •  legaltechsolutions.org</text>
  
  <!-- Filets décoratifs (style papier ligné) -->
  <g stroke="#D9D2E4" stroke-width="0.5" opacity="0.5">
    <line x1="100" y1="480" x2="1100" y2="480"/>
    <line x1="100" y1="500" x2="1100" y2="500"/>
  </g>
</svg>